<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MPI Bahasa Indonesia Bab 2 Di Bawah Atap</title>
<style>
:root{
  --c1:#c2410c; --c2:#0e7490; --c3:#7e22ce; --bg1:#fff7ed; --bg2:#ecfeff;
  --ink:#1f2937; --good:#16a34a; --bad:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:clamp(8px,min(1vw,1.7778vh),40px)}
body{font-family:"Segoe UI",Tahoma,Verdana,system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));min-height:100vh;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#stage{flex:1;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;padding:2.4rem 4rem 1.2rem;display:none;flex-direction:column;animation:in .35s ease}
.slide.on{display:flex}
@keyframes in{from{opacity:0;transform:translateX(3rem)}to{opacity:1;transform:none}}
.hd{display:flex;align-items:center;gap:1.4rem;margin-bottom:1.6rem}
.hd .no{background:var(--c1);color:#fff;font-weight:800;font-size:2.6rem;width:5.2rem;height:5.2rem;border-radius:50%;display:grid;place-items:center;flex:none;box-shadow:0 .4rem 1rem rgba(0,0,0,.18)}
.hd h2{font-size:3.5rem;line-height:1.1;color:var(--c1)}
.hd .sub{font-size:1.7rem;color:#64748b;margin-top:.2rem}
.body{flex:1;font-size:2.35rem;line-height:1.45;overflow:auto;padding-bottom:.5rem}
.body ul{list-style:none}
.body li{margin:.7rem 0;padding-left:2.6rem;position:relative}
.body li::before{content:"●";color:var(--c2);position:absolute;left:0;font-size:1.7rem;top:.45rem}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:start}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6rem}
.cols5{display:grid;grid-template-columns:repeat(5,1fr);gap:1.2rem}
.card{background:#fff;border-radius:1.6rem;padding:1.4rem 1.8rem;box-shadow:0 .5rem 1.6rem rgba(0,0,0,.09);border-top:.5rem solid var(--c1)}
.card h3{font-size:2.3rem;color:var(--c1);margin-bottom:.4rem}
.card.c2{border-top-color:var(--c2)}
.card.c2 h3{color:var(--c2)}
.card.c3{border-top-color:var(--c3)}
.card.c3 h3{color:var(--c3)}
.card.sm{font-size:1.9rem;line-height:1.35}
.ex{background:#fff7d6;border-left:.7rem solid #f59e0b;border-radius:1rem;padding:1rem 1.6rem;margin:1rem 0;font-size:2.1rem}
.ex b.t{display:block;color:#b45309;font-size:1.6rem;letter-spacing:.05em;text-transform:uppercase}
.key{background:var(--c1);color:#fff;border-radius:1.2rem;padding:1rem 1.8rem;margin-top:1rem;font-weight:700;font-size:2.2rem;text-align:center}
.big{font-size:3.2rem;font-weight:800;text-align:center}
.center{text-align:center}
.emo{font-size:4.6rem;line-height:1;margin-bottom:.4rem;display:block}
.arab{font-family:"Traditional Arabic","Amiri","Scheherazade New","Noto Naskh Arabic","Times New Roman",serif;font-size:4.4rem;color:var(--c1);direction:rtl;line-height:1.2;display:block;text-align:center}
.tag{display:inline-block;background:var(--c2);color:#fff;border-radius:999px;padding:.1rem 1.1rem;font-size:1.7rem;font-weight:700;margin-right:.5rem}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .25rem;font-weight:800}
.fr b{font-weight:800;padding:0 .35rem;border-bottom:.2rem solid currentColor}
.fr i{font-style:normal;padding:0 .35rem}
.sym{font-weight:800;margin:0 .6rem;color:var(--c2)}
.fbar{display:flex;gap:.25rem;width:100%;max-width:30rem;height:3.4rem;margin:.4rem auto}
.fbar span{flex:1;border-radius:.5rem;background:#e2e8f0;border:.15rem solid #94a3b8}
.fbar span.f{background:var(--c2);border-color:var(--c1)}
.barrow{display:flex;align-items:center;gap:1.2rem;margin:.5rem 0;font-size:2.2rem}
.barrow .fr{min-width:4.2rem}
.barrow .fbar{max-width:none;flex:1;margin:0}
.g100{display:grid;grid-template-columns:repeat(10,1fr);gap:.15rem;width:20rem;height:20rem;margin:0 auto}
.g100 span{background:#e2e8f0;border-radius:.25rem}
.g100 span.f{background:var(--c2)}
table{border-collapse:collapse;width:100%;font-size:2.1rem;background:#fff;border-radius:1rem;overflow:hidden;box-shadow:0 .4rem 1.2rem rgba(0,0,0,.08)}
th{background:var(--c1);color:#fff;padding:.7rem 1rem}
td{padding:.6rem 1rem;border-bottom:.1rem solid #e5e7eb;text-align:center}
tr:last-child td{border-bottom:none}
.hl{color:var(--c2);font-weight:800}
/* cover */
.cover{justify-content:center;align-items:center;text-align:center;padding-bottom:5rem}
.cover .badge{background:#fff;color:var(--c1);padding:.5rem 2rem;border-radius:999px;font-weight:800;font-size:2rem;box-shadow:0 .3rem .9rem rgba(0,0,0,.12)}
.cover .ico{font-size:11rem;margin:1rem 0 .4rem;filter:drop-shadow(0 .6rem .8rem rgba(0,0,0,.2))}
.cover h1{font-size:6.4rem;line-height:1.05;color:var(--c1);margin:.4rem 0}
.cover .bab{font-size:3rem;font-weight:700;color:var(--c2)}
.cover .meta{margin-top:2rem;font-size:1.9rem;color:#475569;line-height:1.5}
.cover .meta b{color:var(--ink)}
.startbtn{margin-top:2rem;background:var(--c2);color:#fff;border:0;border-radius:999px;font-size:2.8rem;font-weight:800;padding:1rem 4rem;cursor:pointer;box-shadow:0 .6rem 1.4rem rgba(0,0,0,.2)}
/* quiz */
.qwrap{display:flex;flex-direction:column;gap:1.2rem;flex:1}
.qtop{display:flex;justify-content:space-between;align-items:center;font-size:2rem;font-weight:700;color:var(--c1)}
.qbar{height:1rem;background:#e2e8f0;border-radius:999px;overflow:hidden;flex:1;margin:0 1.5rem}
.qbar div{height:100%;background:var(--c2);transition:width .4s}
.qtext{background:#fff;border-radius:1.6rem;padding:1.4rem 2rem;font-size:2.7rem;font-weight:700;line-height:1.3;box-shadow:0 .5rem 1.4rem rgba(0,0,0,.09)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem}
.opt{background:#fff;border:.25rem solid #cbd5e1;border-radius:1.4rem;padding:1rem 1.4rem;font-size:2.4rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:1rem;text-align:left;color:var(--ink);min-height:6rem;font-family:inherit}
.opt:hover:not(:disabled){border-color:var(--c2);transform:scale(1.015)}
.opt .l{flex:none;width:3.6rem;height:3.6rem;border-radius:50%;background:var(--c1);color:#fff;display:grid;place-items:center;font-weight:800;font-size:2rem}
.opt.ok{background:#dcfce7;border-color:var(--good)}
.opt.ok .l{background:var(--good)}
.opt.no{background:#fee2e2;border-color:var(--bad);animation:shake .4s}
.opt.no .l{background:var(--bad)}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-.8rem)}75%{transform:translateX(.8rem)}}
.fb{display:none;border-radius:1.2rem;padding:.9rem 1.6rem;font-size:2.1rem;line-height:1.35}
.fb.show{display:block}
.fb.g{background:#dcfce7;border:.2rem solid var(--good)}
.fb.r{background:#fee2e2;border:.2rem solid var(--bad)}
.fb b{display:block;font-size:2.4rem}
.nextq{align-self:flex-end;background:var(--c1);color:#fff;border:0;border-radius:999px;font-size:2.3rem;font-weight:800;padding:.7rem 2.6rem;cursor:pointer;display:none}
.nextq.show{display:block}
.result{align-items:center;justify-content:center;text-align:center}
.result .stars{font-size:6rem;letter-spacing:.5rem}
.result .score{font-size:9rem;font-weight:900;color:var(--c1);line-height:1}
.result .msg{font-size:3rem;font-weight:700;margin:1rem 0 1.6rem}
.rbtn{background:var(--c2);color:#fff;border:0;border-radius:999px;font-size:2.4rem;font-weight:800;padding:.9rem 3rem;cursor:pointer;margin:0 .6rem}
.rbtn.alt{background:var(--c1)}
/* nav */
#nav{display:flex;align-items:center;gap:1.2rem;padding:.7rem 2rem;background:rgba(255,255,255,.85);backdrop-filter:blur(6px);border-top:.15rem solid rgba(0,0,0,.08)}
#nav button{border:0;border-radius:999px;background:var(--c1);color:#fff;font-weight:800;font-size:1.9rem;padding:.6rem 2rem;cursor:pointer;font-family:inherit}
#nav button:disabled{opacity:.35;cursor:default}
#nav .ic{background:#e2e8f0;color:var(--ink);padding:.6rem 1.2rem}
#dots{flex:1;display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap}
#dots i{width:1.3rem;height:1.3rem;border-radius:50%;background:#cbd5e1;cursor:pointer}
#dots i.on{background:var(--c2);transform:scale(1.4)}
#cnt{font-size:1.7rem;font-weight:700;color:#475569;min-width:6rem;text-align:center}
.credit{position:absolute;right:2rem;bottom:.4rem;font-size:1.3rem;color:#94a3b8}
@media (max-width:700px){
  html{font-size:clamp(6px,2.2vw,14px)}
  .cols,.cols3,.cols5,.opts{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app">
  <div id="stage"></div>
  <div id="nav">
    <button id="prev">◀ Kembali</button>
    <div id="dots"></div>
    <span id="cnt"></span>
    <button class="ic" id="snd" title="Suara">🔊</button>
    <button class="ic" id="fs" title="Layar penuh">⛶</button>
    <button id="next">Lanjut ▶</button>
  </div>
</div>
<script>
const DATA = {"mapel": "Bahasa Indonesia", "emoji": "🏠", "judul": "Di Bawah Atap", "tujuan": ["Memahami <b>ide pokok</b> teks yang dibacakan.", "Memahami kaidah <b>awalan me-</b> dan perubahannya.", "Mengenal <b>homonim</b> dan memahami <b>kalimat majemuk</b>.", "Menceritakan kembali hal menarik di lingkungan sekitar dan berdiskusi dengan kalimat yang jelas."], "slides": [{"title": "Teks Simak: Kepala Suku Len", "sub": "Menemukan ide pokok cerita", "html": "<div class=\"cols\"><div>\n              <ul><li>Tigor senang <b>menyiram tanaman</b>, tetapi kucingnya, <b>Molen</b>, takut air.</li><li>Kak Tiur mengingatkan: tanaman <b>sukulen</b> bisa <b>membusuk</b> jika terlalu sering disiram.</li><li>Tigor bercanda menjuluki Molen “Kepala Suku Len”.</li></ul>\n             </div><div class=\"card\">\n              <h3>Ide pokok</h3>\n              <div style=\"font-size:2.1rem;line-height:1.4\">Ide pokok adalah <b>gagasan utama</b> yang dibicarakan dalam teks.<br><br>Pada cerita ini: merawat tanaman sukulen dengan benar, yaitu tidak terlalu sering disiram.</div>\n             </div></div>"}, {"title": "Teks Baca: Ada Vampir di Rumah Ini", "sub": "Hemat energi listrik", "html": "<div class=\"cols\"><div>\n              <ul><li>Kak Lita sering <b>mematikan kipas angin</b> dan <b>mencabut kabel</b> dari stopkontak.</li><li>Alat yang kabelnya tetap terpasang <b>masih mengalirkan listrik</b> walau tidak dipakai.</li><li>Peristiwa ini disebut “<b>vampir listrik</b>”. Sani pun paham pentingnya berhemat.</li></ul>\n             </div><div class=\"card c2\">\n              <h3>Ayo, hemat listrik!</h3>\n              <ul><li>Matikan alat saat tidak dipakai</li><li>Cabut steker dari stopkontak</li><li>Pakai listrik secukupnya</li></ul>\n             </div></div>"}, {"title": "Awalan me-", "sub": "Berubah menjadi men-, mem-, meng-, menge-, meny-", "html": "<div class=\"cols\"><div>\n              <table><tr><th>Bentuk</th><th>Contoh</th></tr>\n               <tr><td>men-</td><td>mencuci, menulis*</td></tr>\n               <tr><td>mem-</td><td>membaca, memukul*</td></tr>\n               <tr><td>meng-</td><td>mengambil, mengirim*</td></tr>\n               <tr><td>meny-</td><td>menyapu*</td></tr>\n               <tr><td>menge-</td><td>mengecat, mengetik</td></tr></table>\n             </div><div>\n              <div class=\"ex\"><b class=\"t\">Ingat!</b>Huruf awal <b>k, p, t, s</b> pada kata dasar akan <b>luluh</b>.<br>me + tulis = me<b>n</b>ulis<br>me + sapu = me<b>ny</b>apu</div>\n              <div style=\"font-size:1.7rem;color:#64748b\">* huruf awal luluh. menge- dipakai untuk kata dasar satu suku kata.</div>\n             </div></div>"}, {"title": "Homonim", "sub": "Lafal dan ejaan sama, makna berbeda", "html": "<div class=\"cols3\">\n              <div class=\"card sm\"><h3>kabur</h3>1. samar, tidak jelas<br>2. melarikan diri</div>\n              <div class=\"card sm c2\"><h3>bisa</h3>1. dapat, mampu<br>2. racun ular</div>\n              <div class=\"card sm c3\"><h3>palu</h3>1. alat pemukul<br>2. nama sebuah kota</div>\n             </div>\n             <div class=\"ex\"><b class=\"t\">Contoh kalimat</b>Adik <b>bisa</b> membaca dengan lancar. &nbsp;|&nbsp; <b>Bisa</b> ular kobra sangat berbahaya.</div>"}, {"title": "Kalimat Majemuk", "sub": "Dua kalimat digabung dengan kata penghubung (konjungsi)", "html": "<div class=\"cols\"><div>\n              <ul><li>Konjungsi: <span class='tag'>dan</span> <span class='tag'>tetapi</span> <span class='tag'>sehingga</span></li><li>Gabungan dua kalimat sederhana menjadi satu kalimat.</li></ul>\n             </div><div>\n              <div class=\"ex\"><b class=\"t\">Contoh</b>Tigor menyiram tanaman, <b>tetapi</b> Molen takut air.</div>\n              <div class=\"ex\"><b class=\"t\">Contoh</b>Kak Lita mencabut steker, <b>sehingga</b> listrik menjadi hemat.</div>\n              <div class=\"ex\"><b class=\"t\">Contoh</b>Ayah membaca koran <b>dan</b> ibu memasak di dapur.</div>\n             </div></div>"}, {"title": "Kosakata Listrik dan Paragraf Deskripsi", "sub": "Menceritakan hal menarik di sekitar kita", "html": "<div class=\"cols\"><div class=\"card\">\n              <h3>Kosakata kelistrikan</h3>\n              <ul><li><b>stopkontak</b>: lubang tempat steker</li><li><b>steker</b>: penyambung kabel ke stopkontak</li><li><b>sakelar</b>: tombol hidup–mati</li><li><b>elektronik</b>: alat yang memakai listrik</li></ul>\n             </div><div>\n              <ul><li><b>Paragraf deskripsi</b> menggambarkan sesuatu sehingga pembaca seolah melihatnya.</li><li>Latihan: tulis pengalamanmu saat <b>listrik padam</b>.</li></ul>\n             </div></div>"}], "quiz": [{"q": "Mengapa Kak Tiur mengingatkan agar tanaman sukulen tidak terlalu sering disiram?", "o": ["Bisa membusuk", "Bisa terbang", "Menjadi kering", "Kucing marah"], "a": 0, "w": "Sukulen yang terlalu sering disiram bisa <b>membusuk</b>."}, {"q": "Kucing Tigor bernama Molen. Molen takut kepada …", "o": ["Air", "Tanaman", "Kak Tiur", "Kipas angin"], "a": 0, "w": "Molen takut <b>air</b>."}, {"q": "“Vampir listrik” pada cerita berarti …", "o": ["Alat yang kabelnya masih terpasang tetap memakai listrik", "Hantu di rumah", "Kipas angin rusak", "Lampu menyala terang"], "a": 0, "w": "Alat yang tetap tersambung stopkontak masih mengalirkan listrik."}, {"q": "me + tulis = …", "o": ["menulis", "mentulis", "memtulis", "mengtulis"], "a": 0, "w": "Huruf awal <b>t</b> luluh: me + tulis = <b>menulis</b>."}, {"q": "Huruf awal kata dasar yang <b>luluh</b> jika diberi awalan me- adalah …", "o": ["k, p, t, s", "b, d, g, j", "l, m, n, r", "c, h, w, y"], "a": 0, "w": "Huruf awal <b>k, p, t, s</b> luluh."}, {"q": "me + sapu = …", "o": ["menyapu", "mensapu", "memsapu", "mengsapu"], "a": 0, "w": "Huruf <b>s</b> luluh: me + sapu = <b>menyapu</b>."}, {"q": "Kata yang lafal dan ejaannya sama tetapi maknanya berbeda disebut …", "o": ["Homonim", "Sinonim", "Antonim", "Awalan"], "a": 0, "w": "Itulah <b>homonim</b>, misalnya kata “bisa”."}, {"q": "Makna kata <b>bisa</b> pada kalimat “Bisa ular kobra sangat berbahaya” adalah …", "o": ["Racun", "Dapat", "Mampu", "Pandai"], "a": 0, "w": "Pada kalimat itu, “bisa” berarti <b>racun</b> ular."}, {"q": "Adik ingin bermain hujan, … ibu melarangnya. Kata penghubung yang tepat adalah …", "o": ["tetapi", "dan", "sehingga", "atau"], "a": 0, "w": "Dua hal yang berlawanan dihubungkan dengan <b>tetapi</b>."}, {"q": "Benda yang dipasang pada stopkontak untuk menyambungkan listrik disebut …", "o": ["Steker", "Sakelar", "Kipas", "Lampu"], "a": 0, "w": "<b>Steker</b> dicolokkan ke stopkontak."}]};
const $ = (s,r=document)=>r.querySelector(s);
const stage = $('#stage');
let slides = [];      // {el, kind}
let cur = 0;
let soundOn = true;

/* ---------- suara sederhana ---------- */
let actx;
function beep(freqs,dur=0.14){
  if(!soundOn) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    freqs.forEach((f,i)=>{
      const o = actx.createOscillator(), g = actx.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t+i*dur);
      g.gain.exponentialRampToValueAtTime(0.25,t+i*dur+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+i*dur+dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t+i*dur); o.stop(t+i*dur+dur+0.02);
    });
  }catch(e){}
}

/* ---------- pembangun slide ---------- */
function mk(cls, html){
  const s = document.createElement('section');
  s.className = 'slide '+cls;
  s.innerHTML = html;
  stage.appendChild(s);
  return s;
}
function head(no, title, sub){
  return `<div class="hd"><div class="no">${no}</div><div><h2>${title}</h2>${sub?`<div class="sub">${sub}</div>`:''}</div></div>`;
}
function build(){
  const D = DATA;
  // 1. sampul
  slides.push({kind:'cover', el: mk('cover', `
    <div class="badge">MPI • ${D.mapel} • Kelas IV • Semester 1</div>
    <div class="ico">${D.emoji}</div>
    <div class="bab">BAB 2</div>
    <h1>${D.judul}</h1>
    <div class="meta">Media Pembelajaran Interaktif</div>
    <button class="startbtn" onclick="go(1)">Mulai Belajar ▶</button>`)});
  // 2. tujuan
  slides.push({kind:'tujuan', el: mk('', head('🎯','Tujuan Pembelajaran','Setelah belajar, kalian dapat:') +
    `<div class="body"><ul>${D.tujuan.map(t=>`<li>${t}</li>`).join('')}</ul></div>`)});
  // 3. materi
  D.slides.forEach((s,i)=>{
    slides.push({kind:'materi', el: mk('', head(i+1, s.title, s.sub||'') + `<div class="body">${s.html}</div>`)});
  });
  // 4. pengantar kuis
  slides.push({kind:'intro', el: mk('cover', `
    <div class="ico">🏆</div><h1>Ayo, Kuis!</h1>
    <div class="meta" style="font-size:2.6rem">${D.quiz.length} soal pilihan ganda • ketuk jawaban yang benar<br>Jawab dengan teliti, ya!</div>
    <button class="startbtn" onclick="go(${slides.length+1})">Mulai Kuis ▶</button>`)});
  // 5. kuis
  const qEl = mk('', `<div class="qwrap" id="qwrap"></div>`);
  slides.push({kind:'quiz', el:qEl});
  // 6. hasil
  const rEl = mk('result', `
    <div class="stars" id="rstars"></div>
    <div class="score" id="rscore"></div>
    <div class="msg" id="rmsg"></div>
    <div><button class="rbtn" onclick="restartQuiz()">🔁 Ulangi Kuis</button>
    <button class="rbtn alt" onclick="go(1)">📖 Baca Materi Lagi</button></div>`);
  slides.push({kind:'result', el:rEl});

  // dots
  const dots = $('#dots');
  slides.forEach((s,i)=>{ const d=document.createElement('i'); d.onclick=()=>go(i); dots.appendChild(d); });

  // pecahan visual
  document.querySelectorAll('.fbar').forEach(b=>{
    const n=+b.dataset.n, d=+b.dataset.d;
    for(let i=0;i<d;i++){ const s=document.createElement('span'); if(i<n) s.className='f'; b.appendChild(s); }
  });
  document.querySelectorAll('.g100').forEach(g=>{
    const n=+g.dataset.n;
    for(let i=0;i<100;i++){ const s=document.createElement('span'); if(i<n) s.className='f'; g.appendChild(s); }
  });
}

/* ---------- kuis ---------- */
let qi=0, score=0, order=[], answered=false;
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function startQuiz(){
  qi=0; score=0;
  renderQ();
}
function renderQ(){
  const q = DATA.quiz[qi];
  answered=false;
  order = shuffle(q.o.map((t,i)=>({t,i})));
  const L = ['A','B','C','D','E'];
  $('#qwrap').innerHTML = `
    <div class="qtop"><span>Soal ${qi+1}/${DATA.quiz.length}</span><div class="qbar"><div style="width:${(qi/DATA.quiz.length)*100}%"></div></div><span>⭐ ${score}</span></div>
    <div class="qtext">${q.q}</div>
    <div class="opts">${order.map((o,k)=>`<button class="opt" data-k="${k}"><span class="l">${L[k]}</span><span>${o.t}</span></button>`).join('')}</div>
    <div class="fb" id="fb"></div>
    <button class="nextq" id="nextq">${qi===DATA.quiz.length-1?'Lihat Hasil ▶':'Soal Berikutnya ▶'}</button>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  $('#nextq').onclick = nextQ;
}
function pick(k){
  if(answered) return; answered=true;
  const q = DATA.quiz[qi];
  const right = order[k].i === q.a;
  document.querySelectorAll('.opt').forEach((b,idx)=>{
    b.disabled=true;
    if(order[idx].i===q.a) b.classList.add('ok');
  });
  const fb = $('#fb');
  if(right){ score++; beep([660,880]); fb.className='fb show g'; fb.innerHTML=`<b>✅ Benar! Hebat!</b>${q.w}`; }
  else { beep([220,180],0.2); document.querySelectorAll('.opt')[k].classList.add('no'); fb.className='fb show r'; fb.innerHTML=`<b>❌ Belum tepat. Jangan menyerah!</b>${q.w}`; }
  $('#nextq').classList.add('show');
}
function nextQ(){
  if(qi < DATA.quiz.length-1){ qi++; renderQ(); }
  else { showResult(); }
}
function showResult(){
  const n = DATA.quiz.length;
  const pct = Math.round(score/n*100);
  $('#rscore').textContent = pct;
  const st = pct>=90?5:pct>=75?4:pct>=60?3:pct>=40?2:1;
  $('#rstars').textContent = '★'.repeat(st)+'☆'.repeat(5-st);
  $('#rstars').style.color = '#f59e0b';
  $('#rmsg').textContent = (pct>=90?'Luar biasa! ':pct>=75?'Bagus sekali! ':pct>=60?'Cukup baik! ':'Ayo semangat belajar lagi! ') + `Benar ${score} dari ${n} soal.`;
  beep(pct>=60?[523,659,784,1047]:[392,330],0.16);
  go(slides.length-1);
}
function restartQuiz(){ startQuiz(); go(slides.length-2); }

/* ---------- navigasi ---------- */
function go(i){
  i = Math.max(0, Math.min(slides.length-1, i));
  slides.forEach((s,k)=>s.el.classList.toggle('on',k===i));
  cur=i;
  document.querySelectorAll('#dots i').forEach((d,k)=>d.classList.toggle('on',k===i));
  $('#cnt').textContent = (i+1)+' / '+slides.length;
  $('#prev').disabled = (i===0);
  const kind = slides[i].kind;
  $('#next').disabled = (i===slides.length-1) || kind==='quiz';
  if(kind==='quiz' && qi===0 && !answered && !$('#qwrap').children.length) startQuiz();
}
$('#prev').onclick = ()=>{
  if(slides[cur].kind==='result') go(cur-2); else go(cur-1);
};
$('#next').onclick = ()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown') { if(!$('#next').disabled) go(cur+1); }
  if(e.key==='ArrowLeft'||e.key==='PageUp') { if(!$('#prev').disabled) $('#prev').click(); }
});
let tx=null;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{
  if(tx===null) return; const dx=e.changedTouches[0].clientX-tx; tx=null;
  if(Math.abs(dx)>90 && slides[cur].kind!=='quiz'){ dx<0 ? (!$('#next').disabled&&go(cur+1)) : (!$('#prev').disabled&&$('#prev').click()); }
});
$('#snd').onclick = ()=>{ soundOn=!soundOn; $('#snd').textContent = soundOn?'🔊':'🔇'; };
$('#fs').onclick = ()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); else document.exitFullscreen(); };

build();
go(0);
</script>
</body>
</html>
